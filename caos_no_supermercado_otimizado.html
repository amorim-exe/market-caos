import * as THREE from 'three';

import * as CANNON from 'cannon-es';

import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';



const scene = new THREE.Scene();

scene.background = new THREE.Color('#87CEEB');

scene.fog = new THREE.Fog('#87CEEB', 35, 130);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 250);

const renderer = new THREE.WebGLRenderer({antialias:true});

renderer.setSize(innerWidth,innerHeight);

renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));

renderer.shadowMap.enabled = true;

renderer.shadowMap.type = THREE.PCFShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);



scene.add(new THREE.HemisphereLight(0xffffff,0x667788,1.35));

const sun = new THREE.DirectionalLight(0xffffff,2.0);

sun.position.set(30,50,25); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024);

sun.shadow.camera.left=-60;sun.shadow.camera.right=60;sun.shadow.camera.top=60;sun.shadow.camera.bottom=-60;

scene.add(sun);



const world = new CANNON.World({gravity:new CANNON.Vec3(0,-9.8,0)});

world.broadphase = new CANNON.SAPBroadphase(world);

world.allowSleep = true;

const groundMat = new CANNON.Material('ground');

const cartMat = new CANNON.Material('cart');

const objectMat = new CANNON.Material('object');

world.addContactMaterial(new CANNON.ContactMaterial(groundMat,cartMat,{friction:.25,restitution:.05}));

world.addContactMaterial(new CANNON.ContactMaterial(cartMat,objectMat,{friction:.45,restitution:.2}));

world.addContactMaterial(new CANNON.ContactMaterial(groundMat,objectMat,{friction:.65,restitution:.12}));



const synced=[];

const dynamicBodies=[];

const specialItems=[];

const keys={w:false,a:false,s:false,d:false,ArrowUp:false,ArrowDown:false,ArrowLeft:false,ArrowRight:false,' ':false};

const statusEl=document.querySelector('#status');

let statusTimer;

function showStatus(text,color='#ff3366'){

  statusEl.textContent=text;statusEl.style.color=color;statusEl.style.opacity=1;

  clearTimeout(statusTimer);statusTimer=setTimeout(()=>statusEl.style.opacity=0,1300);

}

function addBox(size,pos,mass,color,material=objectMat){

  const mesh=new THREE.Mesh(new THREE.BoxGeometry(size.x,size.y,size.z),new THREE.MeshStandardMaterial({color,roughness:.8}));

  mesh.castShadow=mass>0;mesh.receiveShadow=true;mesh.position.set(pos.x,pos.y,pos.z);scene.add(mesh);

  const body=new CANNON.Body({mass,material,position:new CANNON.Vec3(pos.x,pos.y,pos.z),linearDamping:mass?0.08:0,angularDamping:mass?0.12:0});

  body.addShape(new CANNON.Box(new CANNON.Vec3(size.x/2,size.y/2,size.z/2)));world.addBody(body);

  if(mass>0){synced.push({mesh,body});dynamicBodies.push(body);}

  return {mesh,body};

}



// Piso visual e físico

const mtlLoader=new MTLLoader();

mtlLoader.load('./models/materials.mtl', materials=>{

  materials.preload();

  const objLoader=new OBJLoader();

  objLoader.setMaterials(materials);

  objLoader.load('./models/floor.obj', originalObj=>{

    originalObj.receiveShadow=true;

    originalObj.traverse(child=>{

      if(child.isMesh){

        child.castShadow=false;

        child.receiveShadow=true;

      }

    });



    // Criar grid de floors para cobrir o mapa

    const tileSize=3;

    const gridSize=6;

    for(let x=-gridSize;x<=gridSize;x++){

      for(let z=-gridSize;z<=gridSize;z++){

        const floorInstance=originalObj.clone();

        floorInstance.position.set(x*tileSize,0,z*tileSize);

        scene.add(floorInstance);

      }

    }

  }, undefined, err=>console.error('Erro ao carregar floor.obj',err));

}, undefined, err=>console.error('Erro ao carregar materials.mtl',err));

function addBound(x,z,sx,sz){const b=new CANNON.Body({mass:0,position:new CANNON.Vec3(x,5,z)});b.addShape(new CANNON.Box(new CANNON.Vec3(sx/2,5,sz/2)));world.addBody(b);}

const shelfColors=[0xdddddd,0xc4c4c4];



function spawnShelfProduct(pos,yLevel){

  const shelfModels=[beerModel,canned1Model,cerealModel,cereal2Model,hotdogModel,milkModel].filter(m=>m!==null);

  const productColors=[0xff595e,0xffca3a,0x8ac926,0x1982c4,0x6a4c93];



  // 20% de chance de usar modelo 3D, 80% de usar caixa simples (fake)

  if(shelfModels.length>0 && Math.random()<0.2){

    const model=shelfModels[Math.floor(Math.random()*shelfModels.length)];

    const mesh=model.clone();

    fitModel(mesh);

    mesh.scale.setScalar(.55);

    mesh.position.set(pos.x,yLevel,pos.z);

    mesh.castShadow=false;

    mesh.receiveShadow=false;

    scene.add(mesh);

    const shape=new CANNON.Box(new CANNON.Vec3(.55,.55,.55));

    const body=new CANNON.Body({mass:1,material:objectMat,position:new CANNON.Vec3(pos.x,yLevel,pos.z),linearDamping:.08,allowSleep:true,sleepSpeedLimit:.15,sleepTimeLimit:.8});

    body.addShape(shape);

    world.addBody(body);

    synced.push({mesh,body});

    dynamicBodies.push(body);

  }else{

    // Caixa simples (fake) com cor sólida

    const mesh=new THREE.Mesh(new THREE.BoxGeometry(.55,.55,.55),new THREE.MeshStandardMaterial({color:productColors[Math.floor(Math.random()*productColors.length)],roughness:.8}));

    mesh.position.set(pos.x,yLevel,pos.z);

    mesh.castShadow=false;

    mesh.receiveShadow=false;

    scene.add(mesh);

    const shape=new CANNON.Box(new CANNON.Vec3(.275,.275,.275));

    const body=new CANNON.Body({mass:1,material:objectMat,position:new CANNON.Vec3(pos.x,yLevel,pos.z),linearDamping:.08,allowSleep:true,sleepSpeedLimit:.15,sleepTimeLimit:.8});

    body.addShape(shape);

    world.addBody(body);

    synced.push({mesh,body});

    dynamicBodies.push(body);

  }

}



function spawnShelves(){

  for(let i=-3;i<=3;i++){

    if(i===0)continue;const x=i*14;

    addBox({x:4,y:.5,z:50},{x,y:.25,z:0},0,shelfColors[Math.abs(i)%2],groundMat);

    addBox({x:4,y:.2,z:50},{x,y:3,z:0},0,shelfColors[Math.abs(i)%2],groundMat);

    for(let z=-24;z<=24;z+=2.0){

      spawnShelfProduct({x:x+(Math.random()*1.2-.6),z},2.5);

      spawnShelfProduct({x:x+(Math.random()*1.2-.6),z},5.5);

    }

  }

}



function spawnWallsAndDecorations(){

  // Paredes ao redor do mapa (duplicadas para cobrir toda a extensão)

  const wallPositions=[];

  // Parede norte

  for(let x=-45;x<=45;x+=3){

    wallPositions.push({x,z:-48,rotY:0});

  }

  // Parede sul

  for(let x=-45;x<=45;x+=3){

    wallPositions.push({x,z:48,rotY:Math.PI});

  }

  // Parede oeste

  for(let z=-45;z<=45;z+=3){

    wallPositions.push({x:-48,z,rotY:Math.PI/2});

  }

  // Parede leste

  for(let z=-45;z<=45;z+=3){

    wallPositions.push({x:48,z,rotY:-Math.PI/2});

  }



  for(const pos of wallPositions){

    if(wallModel){

      const wall=wallModel.clone();

      fitModel(wall);

      wall.scale.setScalar(2);

      wall.position.set(pos.x,-1,pos.z);

      wall.rotation.y=pos.rotY;

      wall.castShadow=false;

      wall.receiveShadow=false;

      scene.add(wall);

    }

  }



  // Quadros nas paredes

  const quadroPositions=[

    {x:-20,z:-47,rotY:0,type:1},

    {x:0,z:-47,rotY:0,type:2},

    {x:20,z:-47,rotY:0,type:1},

    {x:-20,z:47,rotY:Math.PI,type:2},

    {x:0,z:47,rotY:Math.PI,type:1},

    {x:20,z:47,rotY:Math.PI,type:2}

  ];



  for(const pos of quadroPositions){

    const model=pos.type===1?quadro1Model:quadro2Model;

    if(model){

      const quadro=model.clone();

      fitModel(quadro);

      quadro.scale.setScalar(2);

      quadro.position.set(pos.x,0.5,pos.z);

      quadro.rotation.y=pos.rotY;

      quadro.castShadow=false;

      scene.add(quadro);

    }

  }

}

const ramp=addBox({x:8,y:1,z:12},{x:0,y:.2,z:-25},0,0xff9900,groundMat);

ramp.body.quaternion.setFromEuler(Math.PI/8,0,0);ramp.mesh.quaternion.copy(ramp.body.quaternion);



// Jogador: corpo físico separado do modelo visual

const cartGroup=new THREE.Group();scene.add(cartGroup);

const cartBody=new CANNON.Body({

cartBody.addShape(new CANNON.Box(new CANNON.Vec3(.75,.55,1.05)));

cartBody.updateMassProperties();world.addBody(cartBody);

const wheels=[];

function createFallbackCart(){

  const group=new THREE.Group();

  const metal=new THREE.MeshStandardMaterial({color:0xbec4ca,metalness:.65,roughness:.35});

  const dark=new THREE.MeshStandardMaterial({color:0x202020,roughness:.7});

  const basket=new THREE.Mesh(new THREE.BoxGeometry(1.45,.8,1.65),metal);basket.position.y=1.15;basket.castShadow=true;group.add(basket);

  // barras para sugerir a cesta vazada

  const barMat=new THREE.MeshStandardMaterial({color:0x7e858b,metalness:.7,roughness:.3});

  for(let y=.85;y<=1.5;y+=.22){

    for(const x of [-.68,.68]){

      const bar=new THREE.Mesh(new THREE.BoxGeometry(.045,.045,1.55),barMat);bar.position.set(x,y,0);group.add(bar);

    }

    for(const z of [-.78,.78]){

      const bar=new THREE.Mesh(new THREE.BoxGeometry(1.35,.045,.045),barMat);bar.position.set(0,y,z);group.add(bar);

    }

  }

  const handle=new THREE.Mesh(new THREE.CylinderGeometry(.07,.07,1.4,12),new THREE.MeshStandardMaterial({color:0xe53935}));

  handle.rotation.z=Math.PI/2;handle.position.set(0,1.75,1.15);group.add(handle);

  for(const [x,z] of [[-.65,.72],[.65,.72],[-.65,-.72],[.65,-.72]]){

    const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.19,.19,.13,16),dark);wheel.rotation.z=Math.PI/2;wheel.position.set(x,.25,z);group.add(wheel);wheels.push(wheel);

  }

  return group;

}

function fitModel(root){

  // Ajuste uniforme para o modelo caber no espaço visual do jogador.

  root.updateMatrixWorld(true);

  const box=new THREE.Box3().setFromObject(root);

  const size=box.getSize(new THREE.Vector3());

  const maxDim=Math.max(size.x,size.y,size.z);

  if(!Number.isFinite(maxDim)||maxDim<=0) return;

  root.scale.setScalar(3.0/maxDim);

  root.updateMatrixWorld(true);

  const scaledBox=new THREE.Box3().setFromObject(root);

  const center=scaledBox.getCenter(new THREE.Vector3());

  root.position.x-=center.x;

  root.position.z-=center.z;

  root.position.y-=scaledBox.min.y;

}

function setCartModel(root){

  if(cartVisual) cartGroup.remove(cartVisual);

  wheels.length=0;

  fitModel(root);

  cartVisual=root;

  cartGroup.add(root);

  // O GLB pode ter sido exportado com a frente apontando para +Z.

  // Se necessário, altere a rotação abaixo para Math.PI.

  root.rotation.y=0;

}

const gltfLoader=new GLTFLoader();

gltfLoader.load(

  './models/cart.glb',

  gltf=>setCartModel(gltf.scene),

  undefined,

  error=>console.error('Não foi possível carregar ./models/cart.glb. Confirme o caminho e execute pelo Live Server.',error)

);



// Carregar modelos de itens especiais e prateleiras

let bananaModel=null, watermelonModel=null, sodaModel=null;

let beerModel=null, canned1Model=null, cerealModel=null, cereal2Model=null, hotdogModel=null, milkModel=null;

let wallModel=null, quadro1Model=null, quadro2Model=null;

let modelsLoaded={banana:false,watermelon:false,soda:false,beer:false,canned1:false,cereal:false,cereal2:false,hotdog:false,milk:false,wall:false,quadro1:false,quadro2:false};



function checkModelsAndSpawn(){

  if(modelsLoaded.banana && modelsLoaded.watermelon && modelsLoaded.soda &&

     modelsLoaded.beer && modelsLoaded.canned1 && modelsLoaded.cereal &&

     modelsLoaded.cereal2 && modelsLoaded.hotdog && modelsLoaded.milk &&

     modelsLoaded.wall && modelsLoaded.quadro1 && modelsLoaded.quadro2){

    // Spawnar prateleiras com produtos

    spawnShelves();

    // Spawnar paredes e quadros

    spawnWallsAndDecorations();

    // Spawnar itens especiais

    for(let i=0;i<12;i++)spawnSpecialItem('banana',{x:Math.random()*50-25,y:1,z:Math.random()*50-25});

    for(let i=0;i<8;i++)spawnSpecialItem('soda',{x:Math.random()*50-25,y:1,z:Math.random()*50-25});

    for(let i=0;i<10;i++)spawnSpecialItem('watermelon',{x:Math.random()*50-25,y:1,z:Math.random()*50-25});

    spawnSpecialItem('soda',{x:0,y:2,z:-25});

  }

}

// Itens especiais

function spawnSpecialItem(type,pos){

  let mesh,shape;

  if(type==='banana' && bananaModel){

    mesh=bananaModel.clone();

    fitModel(mesh);

    mesh.scale.setScalar(.38);

    mesh.position.set(pos.x,pos.y,pos.z);mesh.castShadow=true;scene.add(mesh);

    shape=new CANNON.Box(new CANNON.Vec3(.38,.3,.38));

  }else if(type==='watermelon' && watermelonModel){

    mesh=watermelonModel.clone();

    fitModel(mesh);

    mesh.scale.setScalar(.18);

    mesh.position.set(pos.x,pos.y,pos.z);mesh.castShadow=true;scene.add(mesh);

    shape=new CANNON.Sphere(.22);

  }else if(type==='soda' && sodaModel){

    mesh=sodaModel.clone();

    fitModel(mesh);

    mesh.scale.setScalar(.08);

    mesh.position.set(pos.x,pos.y,pos.z);mesh.castShadow=true;scene.add(mesh);

    shape=new CANNON.Cylinder(.05,.05,.18,12);

  }else if(type==='banana'){

    mesh=new THREE.Mesh(new THREE.TorusGeometry(.45,.13,8,18,Math.PI*1.5),new THREE.MeshStandardMaterial({color:0xffea00}));

    mesh.rotation.x=Math.PI/2;shape=new CANNON.Box(new CANNON.Vec3(.45,.13,.25));

    mesh.position.set(pos.x,pos.y,pos.z);mesh.castShadow=true;scene.add(mesh);

  }else if(type==='soda'){

    mesh=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.85,16),new THREE.MeshStandardMaterial({color:0xe21b23,metalness:.25,roughness:.3}));

    shape=new CANNON.Cylinder(.28,.28,.85,12);

    mesh.position.set(pos.x,pos.y,pos.z);mesh.castShadow=true;scene.add(mesh);

  }else{

    mesh=new THREE.Mesh(new THREE.SphereGeometry(.55,16,16),new THREE.MeshStandardMaterial({color:0x16b83e}));

    shape=new CANNON.Sphere(.55);

    mesh.position.set(pos.x,pos.y,pos.z);mesh.castShadow=true;scene.add(mesh);

  }

  const body=new CANNON.Body({mass:2,material:objectMat,position:new CANNON.Vec3(pos.x,pos.y,pos.z),linearDamping:.08,allowSleep:true,sleepSpeedLimit:.15,sleepTimeLimit:.8});

  body.addShape(shape);world.addBody(body);synced.push({mesh,body});dynamicBodies.push(body);specialItems.push({type,mesh,body});

}



let turboTime=0,jumpCooldown=0;

function triggerExplosion(center){

  showStatus('KABOOM!','#00ff66');

  for(const b of dynamicBodies){

    if(b===cartBody)continue;

    const d=b.position.distanceTo(center);

    if(d<18){const dir=b.position.vsub(center);if(dir.lengthSquared()<.001)dir.set(0,1,0);dir.normalize();b.applyImpulse(dir.scale( Math.max(0,18-d)*22 ),b.position);}

  }

}

window.addEventListener('keydown',e=>{

  const k=e.key.length===1 ? e.key.toLowerCase() : e.key;

  if(Object.prototype.hasOwnProperty.call(keys,k)) keys[k]=true;

  // Acorda o corpo físico ao receber qualquer comando de movimento.

  if(['w','a','s','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)){

    cartBody.wakeUp();

  }

  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();

});

window.addEventListener('keyup',e=>{

  const k=e.key.toLowerCase();

  if(Object.prototype.hasOwnProperty.call(keys,k)) keys[k]=false;

  if(Object.prototype.hasOwnProperty.call(keys,e.key)) keys[e.key]=false;

});

window.addEventListener('blur',()=>Object.keys(keys).forEach(k=>keys[k]=false));

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});



const clock=new THREE.Clock();

const forward=new CANNON.Vec3(), impulse=new CANNON.Vec3();

function animate(){

  requestAnimationFrame(animate);

  const delta=Math.min(clock.getDelta(),.033);

  // Movimento arcade por velocidade: não depende da força vencer o atrito/física.

  const accelerating=keys.w||keys.ArrowUp, reversing=keys.s||keys.ArrowDown;

  const left=keys.a||keys.ArrowLeft,right=keys.d||keys.ArrowRight;

  if(accelerating||reversing||left||right||keys[' ']) cartBody.wakeUp();

  if(left||right){

    const reverseSteer=(reversing&&!accelerating)?-1:1;

    currentHeading+=(left?1:0)*2.5*delta*reverseSteer;

    currentHeading-=(right?1:0)*2.5*delta*reverseSteer;

  }

  const maxSpeed=turboTime>0?35:20;

  const targetSpeed=accelerating?maxSpeed:(reversing?-maxSpeed*.55:0);

  let currentForwardSpeed=cartBody.velocity.x*(-Math.sin(currentHeading))+cartBody.velocity.z*(-Math.cos(currentHeading));

  const accel=accelerating||reversing?35:20;

  const difference=targetSpeed-currentForwardSpeed;

  currentForwardSpeed+=THREE.MathUtils.clamp(difference,-accel*delta,accel*delta);

  cartBody.velocity.x=-Math.sin(currentHeading)*currentForwardSpeed;

  cartBody.velocity.z=-Math.cos(currentHeading)*currentForwardSpeed;

  // Garante que a velocidade recém-calculada seja aplicada pelo motor de física.

  if(accelerating||reversing||left||right) cartBody.wakeUp();

  // Bloqueia a rotação física; o código controla o rumo.

  cartBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0,1,0),currentHeading);

  cartBody.angularVelocity.set(0,0,0);

  const speed=Math.abs(currentForwardSpeed);

  if(turboTime>0)turboTime=Math.max(0,turboTime-delta);

  if(jumpCooldown>0)jumpCooldown-=delta;

  if(keys[' ']&&jumpCooldown<=0&&cartBody.position.y<2.2){

    cartBody.applyImpulse(new CANNON.Vec3(0,cartBody.mass*1.5,0),cartBody.position);jumpCooldown=.9;

  }

  world.step(1/60,delta,2);

  cartGroup.position.set(cartBody.position.x,cartBody.position.y-.55,cartBody.position.z);

  cartGroup.rotation.set(0,currentHeading,0);

  for(const item of synced){item.mesh.position.copy(item.body.position);item.mesh.quaternion.copy(item.body.quaternion);}

  // Gira as rodas do carrinho de reserva, caso existam.

  for(const wheel of wheels)wheel.rotation.x+=speed*delta*2.5;

  for(let i=specialItems.length-1;i>=0;i--){

    const item=specialItems[i];

    if(cartBody.position.distanceTo(item.body.position)<1.8){

      if(item.type==='banana'){showStatus('ESCORREGOU!','#ffea00');currentHeading+=Math.PI;cartBody.velocity.x+=Math.sin(currentHeading)*4;cartBody.velocity.z+=Math.cos(currentHeading)*4;}

      else if(item.type==='soda'){showStatus('TURBOOO!');turboTime=3.5;}

      else triggerExplosion(item.body.position);

      scene.remove(item.mesh);world.removeBody(item.body);

      const si=synced.findIndex(o=>o.body===item.body);if(si>=0)synced.splice(si,1);

      const di=dynamicBodies.indexOf(item.body);if(di>=0)dynamicBodies.splice(di,1);

      specialItems.splice(i,1);

    }

  }

  const offset=new THREE.Vector3(0,5,9).applyAxisAngle(new THREE.Vector3(0,1,0),currentHeading);

  const target=new THREE.Vector3(cartGroup.position.x+offset.x,cartGroup.position.y+offset.y,cartGroup.position.z+offset.z);

  camera.position.lerp(target,.12);

  camera.lookAt(cartGroup.position.x,cartGroup.position.y+1,cartGroup.position.z);

  renderer.render(scene,camera);

}

camera.position.set(0,7,20);camera.lookAt(0,0,0);animate();

</script>
